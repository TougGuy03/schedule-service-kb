name: OWASP Dependency-Check SCA

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Run OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Cache Dependency-Check data
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-

      - name: Run Dependency-Check scan
        continue-on-error: true
        run: |
          chmod +x mvnw
          ./mvnw org.owasp:dependency-check-maven:12.2.2:check \
            -Dformat=ALL \
            -DfailBuildOnCVSS=11 \
            -DoutputDirectory=target

      - name: Create readable Dependency-Check report
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path

          report_path = Path("target/dependency-check-report.json")
          output_path = Path("dependency-check-report.md")

          lines = [
              "# OWASP Dependency-Check SCA Report",
              "",
          ]

          if not report_path.exists():
              lines.extend([
                  "Dependency-Check JSON report was not generated.",
                  "",
                  "Check the workflow logs for NVD update or Maven execution errors.",
              ])
              output_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          dependencies = report.get("dependencies", [])
          findings = []

          for dependency in dependencies:
              file_name = dependency.get("fileName", "")
              file_path = dependency.get("filePath", "")
              for vulnerability in dependency.get("vulnerabilities", []) or []:
                  severity = vulnerability.get("severity", "UNKNOWN")
                  name = vulnerability.get("name", "")
                  description = (vulnerability.get("description", "") or "").replace("\n", " ")
                  description = description[:220] + ("..." if len(description) > 220 else "")
                  cvss = ""
                  for key in ("cvssv4", "cvssv3", "cvssv2"):
                      score = vulnerability.get(key, {}).get("baseScore")
                      if score is not None:
                          cvss = str(score)
                          break
                  findings.append({
                      "severity": severity,
                      "name": name,
                      "cvss": cvss,
                      "file_name": file_name,
                      "file_path": file_path,
                      "description": description,
                  })

          order = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3, "INFO": 4, "INFORMATIONAL": 4, "UNKNOWN": 5}
          findings.sort(key=lambda item: (order.get(item["severity"].upper(), 5), item["name"]))

          severity_counts = {}
          for finding in findings:
              severity = finding["severity"].upper()
              severity_counts[severity] = severity_counts.get(severity, 0) + 1

          lines.extend([
              f"- Project: `{report.get('projectInfo', {}).get('name', 'unknown')}`",
              f"- Dependencies scanned: `{len(dependencies)}`",
              f"- Vulnerability findings: `{len(findings)}`",
              "",
              "## Severity Summary",
              "",
              "| Severity | Count |",
              "| --- | ---: |",
          ])

          for severity in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"):
              lines.append(f"| {severity} | {severity_counts.get(severity, 0)} |")

          lines.append("")

          if findings:
              lines.extend([
                  "## Findings",
                  "",
                  "| Severity | CVSS | CVE | Dependency | Description |",
                  "| --- | ---: | --- | --- | --- |",
              ])
              for finding in findings:
                  description = finding["description"].replace("|", "\\|")
                  dependency = finding["file_name"] or finding["file_path"]
                  lines.append(
                      f"| {finding['severity']} | {finding['cvss']} | `{finding['name']}` | "
                      f"`{dependency}` | {description} |"
                  )
          else:
              lines.append("No vulnerable dependencies found.")

          output_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
            target/dependency-check-report.xml
            target/dependency-check-report.csv
            dependency-check-report.md
