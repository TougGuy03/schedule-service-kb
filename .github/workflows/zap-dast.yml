name: OWASP ZAP DAST

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: Run OWASP ZAP API Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: schedule_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schedule_service"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Start Spring Boot application
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/schedule_service
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run > app.log 2>&1 &

      - name: Wait for application
        run: |
          timeout 300 bash -c 'until curl -fsS http://localhost:8080/v3/api-docs > /dev/null; do sleep 5; done' || (cat app.log && exit 1)

      - name: Run OWASP ZAP API scan
        run: |
          mkdir -p zap-output

          docker run --rm --network host --user root \
            -v "${{ github.workspace }}:/zap/wrk:rw" \
            -w /zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://localhost:8080/v3/api-docs \
            -f openapi \
            -c zap-rules.tsv \
            -r zap-output/zap-report.html \
            -w zap-output/zap-report.md \
            -J zap-output/zap-report.json \
            -I

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: |
            zap-output/
            app.log
