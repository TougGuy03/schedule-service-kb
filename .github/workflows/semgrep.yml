name: Semgrep SAST

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Run Semgrep
    runs-on: ubuntu-latest
    container: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep scan
        continue-on-error: true
        run: |
          semgrep scan --config auto --config .semgrep.yml --config p/java --config p/secrets --config p/security-audit --json --output semgrep-report.json
          semgrep scan --config auto --config .semgrep.yml --config p/java --config p/secrets --config p/security-audit --text --output semgrep-report.txt
          python -m json.tool semgrep-report.json semgrep-report.json

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep-report.json
            semgrep-report.txt
